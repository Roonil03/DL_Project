learning_rate: 0.001
batch_size: 64
epochs: 100
early_stopping_patience: 10
seeds: [42, 52, 62, 72, 82]
loss_alpha: 1.0 # 1.0 for pure Sharpe, 0.0 for pure MSE, or blend
device: "auto" # auto, cpu, or cuda (cuda fails fast when unavailable)
resume: false
run_root: "results/runs"
checkpoint_every_epoch: true
telemetry_jsonl: true
runtime_warmup_batches: 5
hyperparameter_search:
  metric: "validation_mse"
  max_trials: 2
  tuning_epochs: 3
  learning_rates: [0.001, 0.0003]
