# Local run helper for the Financial DL Benchmark container.
# Data and outputs stay on the host checkout and are mounted in; code/deps stay in the image.
# Manual steps (not executed by the migration):
#   docker compose build jupyter
#   docker compose up jupyter        # then open http://localhost:8888
# GPU (optional): use a CUDA-enabled PyTorch build and uncomment `runtime:
# nvidia` if the NVIDIA Container Toolkit is installed. CPU-only hosts work
# unchanged.
name: fin-dl-benchmark

services:
  jupyter:
    build: .
    image: fin-dl-benchmark:latest
    container_name: fin-dl-benchmark-jupyter
    ports:
      # Authentication is disabled for this local development service, so bind
      # it to host loopback instead of exposing it to the LAN.
      - "127.0.0.1:8888:8888"
    volumes:
      # Primary dataset cache. Writable so the notebook's public Kaggle download
      # cell can populate the git-ignored host directory.
      - ./data:/home/jovyan/work/data
      # Regenerated tables/figures/predictions land back on the host.
      - ./results:/home/jovyan/work/results
      # Live notebook editing from the host.
      - ./notebooks:/home/jovyan/work/notebooks
      - ./configs:/home/jovyan/work/configs:ro
    command: ["start-notebook.sh", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--IdentityProvider.token=''"]
    # runtime: nvidia
